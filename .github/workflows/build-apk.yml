name: Gerar Aplicativo APK - Sara Foto Fácil

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Baixar bibliotecas locais para funcionamento 100% Offline
        run: |
          mkdir -p libs
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js -o libs/jszip.min.js
          curl -sL https://cdn.jsdelivr.net/npm/libheif-js@1.23.5/libheif-wasm/libheif-bundle.js -o libs/libheif-bundle.js
          curl -sL https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js -o libs/heic2any.min.js

      - name: Copiar arquivos web para os assets do Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp style.css android/app/src/main/assets/
          cp app.js android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp -r icons android/app/src/main/assets/
          cp -r libs android/app/src/main/assets/

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Gerar Wrapper e Compilar APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Localizar e organizar arquivo APK
        run: |
          mkdir -p apk_dist
          find android -name "*.apk" -exec cp {} apk_dist/SaraFotoFacil.apk \;
          ls -lh apk_dist/

      - name: Publicar o APK pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: SaraFotoFacil-Instalador
          path: apk_dist/SaraFotoFacil.apk
          if-no-files-found: error
