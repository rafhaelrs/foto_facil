<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (estilo app icon iOS/Android) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Corpo da Câmera Fotográfica -->
  <g filter="url(#shadow)">
    <!-- Visor superior da câmera -->
    <path d="M192 148 L220 120 L292 120 L320 148 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Flash superior direito -->
    <circle cx="340" cy="188" r="16" fill="#FDE047"/>
    
    <!-- Corpo principal -->
    <rect x="106" y="148" width="300" height="216" rx="36" fill="#FFFFFF"/>
    <rect x="122" y="164" width="268" height="184" rx="26" fill="#F8FAFC"/>
    
    <!-- Lente Externa -->
    <circle cx="256" cy="256" r="76" fill="url(#lensGrad)"/>
    <circle cx="256" cy="256" r="62" fill="#4338CA"/>
    <circle cx="256" cy="256" r="46" fill="#1E1B4B"/>
    <!-- Brilho da Lente -->
    <circle cx="272" cy="240" r="14" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Estrela Mágica / Brilho (Representando simplicidade e facilidade) -->
  <path d="M390 100 Q410 100 410 80 Q410 100 430 100 Q410 100 410 120 Q410 100 390 100 Z" fill="url(#sparkleGrad)"/>
  <path d="M100 370 Q115 370 115 355 Q115 370 130 370 Q115 370 115 385 Q115 370 100 370 Z" fill="url(#sparkleGrad)"/>
</svg>
